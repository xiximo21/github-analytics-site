<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库详情 · RepoLens</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body data-page="detail">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M5 13l4 3 3-6 3 4 4-5"/></svg></div>
        <div><div class="brand__name">RepoLens</div><div class="brand__sub">开源健康度分析</div></div>
      </div>
      <nav class="nav">
        <div class="nav__label">分析视图</div>
        <a class="nav__item" data-page="overview" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>总览首页</a>
        <a class="nav__item" data-page="ranking" href="ranking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="13" y="7" width="3" height="11"/></svg>健康度排行</a>
        <a class="nav__item" data-page="languages" href="languages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M12 3v9h9"/></svg>语言生态</a>
        <a class="nav__item" data-page="compare" href="compare.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v6a3 3 0 0 0 3 3h6"/></svg>AI·Web 对比</a>
        <a class="nav__item" data-page="search" href="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>仓库检索</a>
      </nav>
      <div class="sidebar__foot"><div class="sidebar__meta"><span class="dot"></span> PostgreSQL · FastAPI</div></div>
    </aside>
    <div class="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" aria-label="菜单"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="topbar__title"><span class="topbar__crumb">RepoLens / 仓库详情</span><h1 class="topbar__h1" id="pageTitle">仓库详情</h1></div>
        <div class="topbar__spacer"></div>
      </header>
      <main class="content">

<!-- 基本信息 -->
<section class="card mb-6">
  <div class="card__body">
    <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
      <div style="flex:1;min-width:260px">
        <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:6px" id="detailTitle">加载中…</h2>
        <p class="text-2" style="font-size:0.875rem;margin-bottom:10px;color:var(--text-2)" id="detailDesc">—</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap" id="detailBadges"></div>
      </div>
      <div style="text-align:right">
        <div id="healthGauge" style="width:180px;height:180px"></div>
      </div>
    </div>
  </div>
</section>

<!-- 统计卡 -->
<section class="stat-grid mb-6">
  <div class="stat"><div class="stat__label">⭐ 星标</div><div class="stat__value" id="dStars">—</div></div>
  <div class="stat"><div class="stat__label">🔀 Fork</div><div class="stat__value" id="dForks">—</div></div>
  <div class="stat"><div class="stat__label">👥 贡献者</div><div class="stat__value" id="dContribs">—</div></div>
  <div class="stat"><div class="stat__label">📋 Open Issues</div><div class="stat__value" id="dIssues">—</div></div>
</section>

<!-- 维度拆解 + 快照趋势 -->
<section class="grid grid--side mb-6">
  <div class="card">
    <div class="card__head"><div><div class="card__title">健康度维度拆解</div><div class="card__desc">5 维加权评分</div></div></div>
    <div class="card__body"><div id="dimBars"></div></div>
  </div>
  <div class="card">
    <div class="card__head"><div class="card__title">星标趋势</div></div>
    <div class="card__body"><div id="chartSnapshot" class="chart chart--md"></div></div>
  </div>
</section>

<!-- 语言 + 主题 -->
<section class="grid grid--2 mb-6">
  <div class="card">
    <div class="card__head"><div class="card__title">主语言</div></div>
    <div class="card__body" style="padding:20px;text-align:center">
      <div id="dLang" style="font-size:1.5rem;font-weight:700">—</div>
      <div class="text-3" style="font-size:0.75rem;margin-top:4px">Primary Language</div>
    </div>
  </div>
  <div class="card">
    <div class="card__head"><div class="card__title">开源协议</div></div>
    <div class="card__body" style="padding:20px;text-align:center">
      <div id="dLicense" style="font-size:1.1rem;font-weight:600">—</div>
    </div>
  </div>
</section>

      </main>
    </div>
  </div>

  <script src="./js/echarts.min.js"></script>
  <script>
    window.RL={palette:{brand:"#4f46e5",ai:"#8b5cf6",web:"#0ea5b7",text:"#383d52",text1:"#383d52",text2:"#646b82",text3:"#848aa0",border:"#e7e9f0",grid:"#e7e9f0",font:"'Plus Jakarta Sans',system-ui,sans-serif",mono:"'JetBrains Mono',ui-monospace,monospace",excellent:"#16a34a",good:"#65a30d",fair:"#d97706",poor:"#dc2626",langs:["#4f46e5","#0ea5b7","#f59e0b","#ec4899","#10b981","#6366f1","#ef4444","#14b8a6"]},fmt:function(n){return n==null?"\u2014":Number(n).toLocaleString("en-US");},healthLevel:function(s){return s>=80?"excellent":s>=60?"good":s>=40?"fair":"poor";}};
    (function(){const p=document.body.getAttribute("data-page");document.querySelectorAll(".nav__item").forEach(function(a){a.classList.toggle("is-active",a.getAttribute("data-page")===p);});})();
    (function(){const s=document.querySelector(".sidebar"),c=document.querySelector(".scrim"),b=document.querySelector(".menu-btn");if(!s||!b)return;b.addEventListener("click",function(){s.classList.toggle("is-open");c&&c.classList.toggle("is-open");});c&&c.addEventListener("click",function(){s.classList.remove("is-open");c.classList.remove("is-open");});})();

    (function(){
      var params = new URLSearchParams(location.search);
      var repoParam = params.get("repo");
      if (!repoParam) {
        document.getElementById("detailTitle").textContent = "缺少仓库参数";
        document.getElementById("detailDesc").textContent = "请使用 detail.html?repo=owner/name 访问";
        return;
      }
      var repoKey = repoParam.trim();
      var P = RL.palette;

      Promise.all([
        fetch("./data/list.json").then(function(r){return r.json();}),
        fetch("./data/ranking.json").then(function(r){return r.json();}),
        fetch("./data/trend.json").then(function(r){return r.json();})
      ]).then(function(results){
        var listData = results[0].items || [];
        var rankingData = results[1].items || [];
        var trendData = results[2].items || [];

        /* 从 list.json 查找仓库 */
        var repo = null;
        for (var i = 0; i < listData.length; i++) {
          if (listData[i].name_with_owner === repoKey) { repo = listData[i]; break; }
        }
        if (!repo) {
          document.getElementById("detailTitle").textContent = "未找到仓库: " + repoKey;
          return;
        }

        /* 从 ranking.json 找维度 */
        var rankItem = null;
        for (var i = 0; i < rankingData.length; i++) {
          if (rankingData[i].name_with_owner === repoKey) { rankItem = rankingData[i]; break; }
        }

        /* 从 trend.json 找快照 */
        var trendItem = null;
        for (var i = 0; i < trendData.length; i++) {
          if (trendData[i].name_with_owner === repoKey) { trendItem = trendData[i]; break; }
        }

        /* 基本信息 */
        document.getElementById("detailTitle").textContent = repo.name_with_owner;
        document.getElementById("pageTitle").textContent = repo.name;
        document.getElementById("detailDesc").textContent = repo.description || "暂无描述";
        var domBadge = repo.domain === "ai"
          ? '<span class="badge badge--domain-ai"><span class="swatch"></span>AI</span>'
          : '<span class="badge badge--domain-web"><span class="swatch"></span>Web</span>';
        var langBadge = repo.primary_language ? '<span class="badge badge--soft">' + repo.primary_language + '</span>' : '';
        document.getElementById("detailBadges").innerHTML = domBadge + langBadge;

        /* 统计卡 */
        document.getElementById("dStars").textContent = RL.fmt(repo.stargazer_count);
        document.getElementById("dForks").textContent = RL.fmt(repo.fork_count);
        document.getElementById("dContribs").textContent = RL.fmt(repo.contributors_count);
        document.getElementById("dIssues").textContent = RL.fmt(repo.open_issues);

        /* 健康度仪表盘 */
        var hs = repo.health_score || 0;
        var lvl = RL.healthLevel(hs);
        var colorMap = {excellent:P.excellent, good:P.good, fair:P.fair, poor:P.poor};
        var gaugeChart = echarts.init(document.getElementById("healthGauge"));
        gaugeChart.setOption({
          series: [{
            type: "gauge", radius: "90%", center: ["50%","55%"],
            startAngle: 210, endAngle: -30, min: 0, max: 100,
            progress: { show: true, width: 14, itemStyle: { color: colorMap[lvl] || P.brand } },
            axisLine: { lineStyle: { width: 14, color: [[1, P.grid]] } },
            axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
            pointer: { show: false }, anchor: { show: false },
            title: { show: true, offsetCenter: [0, "30%"], fontSize: 13, color: P.text3 },
            detail: { valueAnimation: true, offsetCenter: [0, "-5%"], fontSize: 28, fontWeight: 700,
              color: colorMap[lvl] || P.text, formatter: "{value}" },
            data: [{ value: hs.toFixed(1), name: lvl }]
          }]
        });

        /* 维度条 */
        var dimLabels = {popularity:"流行度", activity:"活跃度", responsiveness:"响应性", maintenance:"维护性", sustainability:"持续性"};
        var dims = (rankItem && rankItem.dimensions) || {};
        var dimHtml = "";
        var dimKeys = Object.keys(dimLabels);
        for (var i = 0; i < dimKeys.length; i++) {
          var k = dimKeys[i];
          var dd = dims[k];
          if (dd == null) dd = 0;
          var pct = Math.min(dd, 100);
          var barColor = repo.domain === "ai" ? "var(--ai-600, #8b5cf6)" : "var(--web-600, #0ea5b7)";
          dimHtml += '<div style="margin-bottom:12px">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="text-2" style="font-size:0.875rem">' + dimLabels[k] + '</span><b style="font-size:0.875rem">' + dd.toFixed(1) + '</b></div>' +
            '<div style="height:8px;border-radius:99px;background:var(--surface-3, #e7e9f0)"><div style="width:' + pct.toFixed(1) + '%;height:100%;border-radius:99px;background:' + barColor + '"></div></div>' +
            '</div>';
        }
        document.getElementById("dimBars").innerHTML = dimHtml || '<div class="text-3" style="text-align:center;padding:20px">维度数据暂不可用</div>';

        /* 快照趋势 */
        if (trendItem && trendItem.snapshots && trendItem.snapshots.length > 0) {
          var snaps = trendItem.snapshots;
          var snapChart = echarts.init(document.getElementById("chartSnapshot"));
          snapChart.setOption({
            grid: { left: 8, right: 16, top: 16, bottom: 6, containLabel: true },
            tooltip: { trigger: "axis" },
            xAxis: { type: "category", data: snaps.map(function(s){ return s.snapshot_date; }), axisLabel: { color: P.text3, fontSize: 11, rotate: 30 } },
            yAxis: { type: "value", axisLabel: { color: P.text3, fontSize: 12 }, splitLine: { lineStyle: { color: P.grid, type: "dashed" } } },
            series: [{ type: "line", smooth: true, data: snaps.map(function(s){ return s.stargazer_count; }),
              lineStyle: { color: P.brand, width: 2 }, itemStyle: { color: P.brand },
              areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"rgba(79,70,229,0.18)"},{offset:1,color:"rgba(79,70,229,0.01)"}]) }
            }]
          });
        } else {
          document.getElementById("chartSnapshot").innerHTML = '<div class="text-3" style="text-align:center;padding:40px;color:var(--text-3)">快照数据不足，需 ≥2 期快照</div>';
        }

        /* 主语言 */
        document.getElementById("dLang").textContent = repo.primary_language || "—";

        /* 协议 */
        document.getElementById("dLicense").textContent = repo.license || "未声明";

      }).catch(function(err){
        console.error(err);
        document.getElementById("detailTitle").textContent = "加载失败";
      });
    })();
  </script>
</body>
</html>
