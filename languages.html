<div class="filters mb-6">
  <div class="field"><label>分布维度</label><select class="select" id="distBy"><option value="language">编程语言</option><option value="license">开源协议</option><option value="topic">主题标签</option></select></div>
  <div class="field"><label>显示数量</label><select class="select" id="distTop"><option value="10">Top 10</option><option value="20" selected>Top 20</option><option value="50">Top 50</option></select></div>
</div>
<section class="grid grid--side mb-6">
  <div class="card"><div class="card__head"><div><div class="card__title" id="distTitle">编程语言分布</div><div class="card__desc" id="distDesc">按仓库使用的主语言统计</div></div></div><div class="card__body"><div id="chartBar" class="chart chart--md"></div></div></div>
  <div class="card"><div class="card__head"><div class="card__title">占比结构</div></div><div class="card__body"><div id="chartPie" class="chart chart--md"></div></div></div>
</section>
<section class="card"><div class="card__head"><div><div class="card__title">明细数据</div><div class="card__desc" id="tableDesc">—</div></div></div><div class="card__body" style="overflow-x:auto"><table class="table" id="distTable"><thead><tr><th>#</th><th>名称</th><th>仓库数</th><th>占比</th><th>平均星标</th><th>平均健康度</th></tr></thead><tbody></tbody></table></div></section></main>
    </div>
  </div>
  <script src="./js/echarts.min.js"></script>
  <script>
    window.RL={palette:{brand:"#4f46e5",ai:"#8b5cf6",web:"#0ea5b7",text:"#383d52",text1:"#383d52",text2:"#646b82",text3:"#848aa0",border:"#e7e9f0",grid:"#e7e9f0",font:"'Plus Jakarta Sans',system-ui,sans-serif",mono:"'JetBrains Mono',ui-monospace,monospace",excellent:"#16a34a",good:"#65a30d",fair:"#d97706",poor:"#dc2626",langs:["#4f46e5","#0ea5b7","#f59e0b","#ec4899","#10b981","#6366f1","#ef4444","#14b8a6"]},fmt:function(n){return n==null?"\u2014":Number(n).toLocaleString("en-US");},healthLevel:function(s){return s>=80?"excellent":s>=60?"good":s>=40?"fair":"poor";}};
    (function(){const p=document.body.getAttribute("data-page");document.querySelectorAll(".nav__item").forEach(function(a){a.classList.toggle("is-active",a.getAttribute("data-page")===p);});})();
    (function(){const s=document.querySelector(".sidebar"),c=document.querySelector(".scrim"),b=document.querySelector(".menu-btn");if(!s||!b)return;b.addEventListener("click",function(){s.classList.toggle("is-open");c&&c.classList.toggle("is-open");});c&&c.addEventListener("click",function(){s.classList.remove("is-open");c.classList.remove("is-open");});})();
  </script>
  <script>
var barChart=echarts.init(document.getElementById("chartBar"));var pieChart=echarts.init(document.getElementById("chartPie"));var P=RL.palette;
var dimLabels={language:"编程语言",license:"开源协议",topic:"主题标签"};var dimDescs={language:"按仓库使用的主语言统计",license:"按开源协议类型统计",topic:"按 Topic 标签统计"};
var DIST_DATA=null;
fetch("./data/distribution.json").then(function(r){return r.json();}).then(function(d){DIST_DATA=d;loadDist();});
function loadDist(){
  if(!DIST_DATA)return;
  var by=document.getElementById("distBy").value;var top=parseInt(document.getElementById("distTop").value);
  var d=DIST_DATA[by];if(!d)return;var items=d.items.slice(0,top);
  document.getElementById("distTitle").textContent=dimLabels[by]+"分布";document.getElementById("distDesc").textContent=dimDescs[by];document.getElementById("tableDesc").textContent="共 "+d.total_repos+" 仓库 · "+items.length+" 项";
  var sorted=items.slice().reverse();
  barChart.setOption({grid:{left:8,right:48,top:10,bottom:6,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"value",axisLabel:{color:P.text3,fontSize:12},splitLine:{lineStyle:{color:P.grid,type:"dashed"}}},yAxis:{type:"category",data:sorted.map(function(i){return i.name;}),axisLabel:{color:P.text3,fontSize:12,width:120,overflow:"truncate"}},series:[{type:"bar",barWidth:18,data:sorted.map(function(i){return i.repo_count;}),itemStyle:{borderRadius:[0,6,6,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:P.brand},{offset:1,color:P.ai}])},label:{show:true,position:"right",color:P.text3,fontSize:12}}]},true);
  var top8=items.slice(0,8);var otherCount=d.total_repos-top8.reduce(function(s,i){return s+i.repo_count;},0);var pieData=top8.map(function(i,idx){return{value:i.repo_count,name:i.name,itemStyle:{color:P.langs[idx%P.langs.length]}};});if(otherCount>0)pieData.push({value:otherCount,name:"其他",itemStyle:{color:P.border}});
  pieChart.setOption({tooltip:{trigger:"item",formatter:"{b}: {c} ({d}%)"},legend:{type:"scroll",bottom:0,icon:"circle",textStyle:{fontSize:12}},series:[{type:"pie",radius:["40%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2,borderRadius:4},label:{show:false},data:pieData}]},true);
  var tbody=document.querySelector("#distTable tbody");tbody.innerHTML="";items.forEach(function(it,idx){var hs=it.avg_health_score!=null?it.avg_health_score.toFixed(2):"\u2014";tbody.insertAdjacentHTML("beforeend","<tr><td>"+(idx+1)+"</td><td>"+it.name+"</td><td>"+RL.fmt(it.repo_count)+"</td><td>"+(it.ratio*100).toFixed(1)+"%</td><td>"+RL.fmt(Math.round(it.avg_stars))+"</td><td>"+hs+"</td></tr>");});
}
document.getElementById("distBy").addEventListener("change",loadDist);document.getElementById("distTop").addEventListener("change",loadDist);
</script>
</body>
