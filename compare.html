  <div class="card"><div class="card__head"><div><div class="card__title">健康度统计对照</div><div class="card__desc">均值 / 中位数 / 极值</div></div></div><div class="card__body"><div class="grid grid--2" style="gap:var(--sp-4)"><div class="stat-list"><div class="stat-list__row"><span>均值</span><b id="aiHsAvg">—</b></div><div class="stat-list__row"><span>中位数</span><b id="aiHsMed">—</b></div><div class="stat-list__row"><span>最大 / 最小</span><b id="aiHsRange">—</b></div><div class="stat-list__row"><span>标准差</span><b id="aiHsStd">—</b></div></div><div class="stat-list"><div class="stat-list__row"><span>均值</span><b id="webHsAvg">—</b></div><div class="stat-list__row"><span>中位数</span><b id="webHsMed">—</b></div><div class="stat-list__row"><span>最大 / 最小</span><b id="webHsRange">—</b></div><div class="stat-list__row"><span>标准差</span><b id="webHsStd">—</b></div></div></div></div></div>

<section class="card"><div class="card__head"><div class="card__title">对比结论摘要</div></div><div class="card__body"><div id="conclusion" class="text-2" style="line-height:1.8">加载中…</div></div></section></main>

  <script src="./js/echarts.min.js"></script>
  <script>
    window.RL={palette:{brand:"#4f46e5",ai:"#8b5cf6",web:"#0ea5b7",text:"#383d52",text1:"#383d52",text2:"#646b82",text3:"#848aa0",border:"#e7e9f0",grid:"#e7e9f0",font:"'Plus Jakarta Sans',system-ui,sans-serif",mono:"'JetBrains Mono',ui-monospace,monospace",excellent:"#16a34a",good:"#65a30d",fair:"#d97706",poor:"#dc2626",langs:["#4f46e5","#0ea5b7","#f59e0b","#ec4899","#10b981","#6366f1","#ef4444","#14b8a6"]},fmt:function(n){return n==null?"\u2014":Number(n).toLocaleString("en-US");},healthLevel:function(s){return s>=80?"excellent":s>=60?"good":s>=40?"fair":"poor";}};
    (function(){const p=document.body.getAttribute("data-page");document.querySelectorAll(".nav__item").forEach(function(a){a.classList.toggle("is-active",a.getAttribute("data-page")===p);});})();
    (function(){const s=document.querySelector(".sidebar"),c=document.querySelector(".scrim"),b=document.querySelector(".menu-btn");if(!s||!b)return;b.addEventListener("click",function(){s.classList.toggle("is-open");c&&c.classList.toggle("is-open");});c&&c.addEventListener("click",function(){s.classList.remove("is-open");c.classList.remove("is-open");});})();
  </script>
  <script>
var P=RL.palette;var dimBarChart=echarts.init(document.getElementById("chartDimBar"));var langAiChart=echarts.init(document.getElementById("chartLangAi"));var langWebChart=echarts.init(document.getElementById("chartLangWeb"));
var dimLabels={popularity:"流行度",activity:"活跃度",responsiveness:"响应性",maintenance:"维护性",sustainability:"持续性"};
function renderLangPie(chart,langs){var data=langs.map(function(l,i){return{value:l.count,name:l.language,itemStyle:{color:P.langs[i%P.langs.length]}};});chart.setOption({tooltip:{trigger:"item",formatter:"{b}: {c} ({d}%)"},legend:{bottom:0,icon:"circle",textStyle:{fontSize:12}},series:[{type:"pie",radius:["38%","70%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2,borderRadius:4},label:{show:false},data:data}]},true);}
fetch("./data/compare.json").then(function(r){return r.json();}).then(function(json){
  var c=json.comparison;
  document.getElementById("aiRepos").textContent=RL.fmt(c.repo_count.ai);document.getElementById("webRepos").textContent=RL.fmt(c.repo_count.web);
  var aiHS=c.health_score.ai,webHS=c.health_score.web;
  document.getElementById("aiHealth").innerHTML=aiHS.avg.toFixed(1)+' <span class="score-pill score-pill--'+RL.healthLevel(aiHS.avg)+'" style="font-size:.5em">'+RL.healthLevel(aiHS.avg)+'</span>';
  document.getElementById("webHealth").innerHTML=webHS.avg.toFixed(1)+' <span class="score-pill score-pill--'+RL.healthLevel(webHS.avg)+'" style="font-size:.5em">'+RL.healthLevel(webHS.avg)+'</span>';
  document.getElementById("aiGrowth").textContent="+"+c.star_growth.ai.avg_growth.toFixed(1);document.getElementById("webGrowth").textContent="+"+c.star_growth.web.avg_growth.toFixed(1);
  document.getElementById("aiHsAvg").textContent=aiHS.avg.toFixed(2);document.getElementById("aiHsMed").textContent=aiHS.median.toFixed(2);document.getElementById("aiHsRange").textContent=aiHS.min.toFixed(1)+" / "+aiHS.max.toFixed(1);document.getElementById("aiHsStd").textContent=aiHS.std.toFixed(2);
  document.getElementById("webHsAvg").textContent=webHS.avg.toFixed(2);document.getElementById("webHsMed").textContent=webHS.median.toFixed(2);document.getElementById("webHsRange").textContent=webHS.min.toFixed(1)+" / "+webHS.max.toFixed(1);document.getElementById("webHsStd").textContent=webHS.std.toFixed(2);
  var dims=c.dimensions;var dimKeys=Object.keys(dims);var categories=dimKeys.map(function(k){return dimLabels[k]||k;});var aiVals=dimKeys.map(function(k){return dims[k].ai;});var webVals=dimKeys.map(function(k){return dims[k].web;});
  dimBarChart.setOption({grid:{left:8,right:24,top:30,bottom:6,containLabel:true},tooltip:{trigger:"axis"},legend:{top:0,data:["AI","Web"]},xAxis:{type:"category",data:categories,axisLabel:{color:P.text3,fontSize:12}},yAxis:{type:"value",axisLabel:{color:P.text3,fontSize:12},splitLine:{lineStyle:{color:P.grid,type:"dashed"}}},series:[{name:"AI",type:"bar",barWidth:24,data:aiVals,itemStyle:{color:P.ai,borderRadius:[6,6,0,0]}},{name:"Web",type:"bar",barWidth:24,data:webVals,itemStyle:{color:P.web,borderRadius:[6,6,0,0]}}]},true);
  renderLangPie(langAiChart,c.top_languages.ai||[]);renderLangPie(langWebChart,c.top_languages.web||[]);
  var winner=aiHS.avg>webHS.avg?"AI":"Web";var diff=Math.abs(c.health_score.diff).toFixed(2);
  var html="<p>在 <b>"+RL.fmt(c.repo_count.ai+c.repo_count.web)+"</b> 个仓库中，AI 域 <b>"+RL.fmt(c.repo_count.ai)+"</b> 个、Web 域 <b>"+RL.fmt(c.repo_count.web)+"</b> 个。</p>";
  html+="<p>健康度均值：<b>AI "+aiHS.avg.toFixed(2)+"</b> vs <b>Web "+webHS.avg.toFixed(2)+"</b>，"+winner+" 域领先 <b>"+diff+"</b> 分。</p>";
  var bestAi=dimKeys.reduce(function(a,b){return dims[a].ai>dims[b].ai?a:b;});var bestWeb=dimKeys.reduce(function(a,b){return dims[a].web>dims[b].web?a:b;});
  html+="<p>AI 最强维度：<b>"+(dimLabels[bestAi]||bestAi)+"</b>（"+dims[bestAi].ai.toFixed(1)+"）；Web 最强维度：<b>"+(dimLabels[bestWeb]||bestWeb)+"</b>（"+dims[bestWeb].web.toFixed(1)+"）。</p>";
  document.getElementById("conclusion").innerHTML=html;
});
</script>
</body>
